<!-- The ClassGrocery mark: a tomato, drawn in the same flat shapes as the
     product artwork so it reads at 16px in a browser tab. The calyx sits on
     the crown of the fruit rather than draping down its face, and its sepals
     are slim, so the fruit stays a clean round shape at small sizes. The stem
     is the same green as the calyx: a darker one sinks into a dark background
     and looks like a hole rather than a stem. The whole tomato is lifted a
     little, because the light stem does not carry the weight the fruit does
     and the mark hangs low without it. This is the mark on its own, for a
     background the page already provides. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ClassGrocery">
  <g transform="translate(0 -4)">
    <path d="M32 23.5V16.5" stroke="#6ec24f" stroke-width="5" stroke-linecap="round"/>
    <path d="M32 21C44 21 51 28.5 51 38.5 51 49.5 42.5 57 32 57 21.5 57 13 49.5 13 38.5 13 28.5 20 21 32 21Z" fill="#e43e35"/>
    <ellipse cx="23" cy="34" rx="4.5" ry="7" transform="rotate(-20 23 34)" fill="#f8a293" opacity=".7"/>
    <path d="M32 22.5Q25.4 19.3 19 22.7Q25.6 25.9 32 22.5ZM32 22.5Q38.4 25.9 45 22.7Q38.6 19.3 32 22.5ZM32 22.5Q25.7 22.8 23 28.5Q29.4 28.3 32 22.5ZM32 22.5Q34.6 28.3 41 28.5Q38.3 22.8 32 22.5ZM32 22.5Q28.7 25.5 32 28.5Q35.3 25.5 32 22.5Z" fill="#6ec24f"/>
    <circle cx="32" cy="22.5" r="3.1" fill="#6ec24f"/>
  </g>
</svg>
